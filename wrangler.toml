name = "manuels-portfolio"
compatibility_date = "2024-09-01"
pages_build_output_dir = "dist"

# ── Object storage that holds the photo files ────────────────────────────────
# The gallery lists this bucket directly (functions/api/photos.js). Add photos
# by dropping images into the bucket via the Cloudflare dashboard.
[[r2_buckets]]
binding = "PHOTOS_BUCKET"
bucket_name = "portfolio-photos"
